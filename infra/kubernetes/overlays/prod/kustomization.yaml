apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitthebill

resources:
  - ../../base

replicas:
  - name: backend
    count: 2
  - name: web
    count: 2

images:
  - name: ghcr.io/epicwhal3/splitthebill-backend
    newName: ghcr.io/epicwhal3/splitthebill-backend
    newTag: latest
  - name: ghcr.io/epicwhal3/splitthebill-web
    newName: ghcr.io/epicwhal3/splitthebill-web
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
