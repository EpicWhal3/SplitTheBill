apiVersion: v1
kind: ConfigMap
metadata:
  name: splitthebill-backend-config
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: splitthebill
data:
  PORT: "8080"
  ALLOWED_ORIGINS: "https://app.example.com"
  MAX_REQUEST_BODY_BYTES: "1048576"
  RATE_LIMIT_REQUESTS_PER_SECOND: "10"
  RATE_LIMIT_BURST: "20"
  ROOM_TTL_HOURS: "168"
  ROOM_CLEANUP_INTERVAL_MINUTES: "60"
