apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: splitthebill
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: splitthebill
    spec:
      containers:
        - name: backend
          image: ghcr.io/epicwhal3/splitthebill-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: splitthebill-backend
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: PORT
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: ALLOWED_ORIGINS
            - name: MAX_REQUEST_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: MAX_REQUEST_BODY_BYTES
            - name: RATE_LIMIT_REQUESTS_PER_SECOND
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: RATE_LIMIT_REQUESTS_PER_SECOND
            - name: RATE_LIMIT_BURST
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: RATE_LIMIT_BURST
            - name: ROOM_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: ROOM_TTL_HOURS
            - name: ROOM_CLEANUP_INTERVAL_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: splitthebill-backend-config
                  key: ROOM_CLEANUP_INTERVAL_MINUTES
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
