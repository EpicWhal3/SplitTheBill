app_namespace: splitthebill
app_overlay: prod

backend_image: ghcr.io/OWNER/splitthebill-backend:latest
web_image: ghcr.io/OWNER/splitthebill-web:latest

app_domain: app.example.com
allowed_origins: "https://app.example.com"

