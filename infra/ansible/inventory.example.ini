# Copy to inventory.ini (ignored by git) and adjust the addresses.
#
# The deploy playbook runs on the control node, so it needs a checkout of this
# repository, kubectl and a kubeconfig. `ansible_connection=local` keeps the
# tasks on the machine where ansible-playbook is executed.
[k8s_control]
k8s-control-01 ansible_connection=local

[k8s_nodes]
k8s-node-01 ansible_host=203.0.113.11 ansible_user=ubuntu
