name: Infrastructure checks

"on":
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "web/app/health/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - "web/app/health/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml:
    name: YAML validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YAML files
        run: |
          python -m pip install --upgrade pyyaml
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          roots = [pathlib.Path("infra/kubernetes"), pathlib.Path("infra/ansible"), pathlib.Path(".github/workflows")]
          files = sorted(
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*")
              if path.is_file() and path.suffix in {".yaml", ".yml"}
          )

          failed = False
          for path in files:
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as error:  # noqa: BLE001 - report every invalid file
                  failed = True
                  print(f"::error file={path}::{error}")
          print(f"Validated {len(files)} YAML file(s)")
          sys.exit(1 if failed else 0)
          PY

  kustomize:
    name: Kustomize build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Build base
        run: kubectl kustomize infra/kubernetes/base > /dev/null

      - name: Build dev overlay
        run: kubectl kustomize infra/kubernetes/overlays/dev > /dev/null

      - name: Build prod overlay
        run: kubectl kustomize infra/kubernetes/overlays/prod > /dev/null

  ansible:
    name: Ansible syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Install collections
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check deploy playbook
        working-directory: infra/ansible
        run: >-
          ansible-playbook --syntax-check
          -i inventory.example.ini
          playbooks/deploy.yml

      - name: Syntax check K3s playbook
        working-directory: infra/ansible
        run: >-
          ansible-playbook --syntax-check
          -i inventory.example.ini
          playbooks/setup-k3s.yml
