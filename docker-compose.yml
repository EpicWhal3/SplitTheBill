services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitthebill
      POSTGRES_USER: splitthebill
      POSTGRES_PASSWORD: splitthebill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitthebill -d splitthebill"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://splitthebill:splitthebill@postgres:5432/splitthebill?sslmode=disable
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_REQUEST_BODY_BYTES: 1048576
      RATE_LIMIT_REQUESTS_PER_SECOND: 10
      RATE_LIMIT_BURST: 20
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
