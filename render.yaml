databases:
  - name: splitthebill-db
    databaseName: splitthebill
    user: splitthebill
    plan: free

services:
  - type: web
    name: splitthebill-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitthebill-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://splitthebill-web.onrender.com
      - key: MAX_REQUEST_BODY_BYTES
        value: "1048576"
      - key: RATE_LIMIT_REQUESTS_PER_SECOND
        value: "20"
      - key: RATE_LIMIT_BURST
        value: "40"

  - type: web
    name: splitthebill-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://splitthebill-api.onrender.com